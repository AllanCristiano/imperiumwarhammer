<div class="viewport">
  <div class="ring" [style.transform]="'translateZ(calc(var(--radius) * -1)) rotateY(' + rotation() + 'deg)'">
    @for (f of factions(); track f.slug; let i = $index) {
      <a
        class="card"
        [attr.href]="'/faccao/' + f.slug"
        [class.active]="i === active()"
        [attr.aria-current]="i === active() ? 'true' : null"
        [attr.aria-label]="f.name"
        [style.--fc]="f.color"
        [style.--fa]="f.accent"
        [style.transform]="'rotateY(' + i * step() + 'deg) translateZ(var(--radius))'"
        (click)="select(i, f, $event)"
        draggable="false"
      >
        <span class="shine"></span>
        <app-emblem-3d
          class="emblem"
          [glyph]="f.glyph"
          [depth]="6"
          [rings]="false"
          [spin]="false"
          size="64%"
          [style.view-transition-name]="i === active() ? 'emblem-' + f.slug : null"
        />
        <span class="name">{{ f.short }}</span>
        <span class="epithet">{{ f.epithet }}</span>
      </a>
    }
  </div>
  <div class="floor"></div>
</div>

<div class="controls">
  <button type="button" class="arrow" aria-label="Anterior" (click)="go(-1)">‹</button>
  @let c = current();
  <div class="caption" aria-live="polite">
    @for (x of [c]; track x.slug) {
      <strong>{{ x.name }}</strong>
      <small>{{ x.motto }}</small>
    }
  </div>
  <button type="button" class="arrow" aria-label="Próxima" (click)="go(1)">›</button>
</div>

<div class="dots" role="tablist">
  @for (f of factions(); track f.slug; let i = $index) {
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="i === active()"
      [attr.aria-label]="f.name"
      [class.on]="i === active()"
      (click)="goTo(i)"
    ></button>
  }
</div>
